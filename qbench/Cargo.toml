[package]
name = "qbench"
version = "0.1.0"
edition = "2021"

# quinn (Rust QUIC) transport for fedbench: same JSON line protocol and chunk format as bench/ (Go).
[dependencies]
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "sync", "net"] }
serde_json = "1"
crc32fast = "1"
libc = "0.2"

[profile.release]
opt-level = 3
